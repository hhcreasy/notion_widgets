const fitOrd={safety:0,realistic:1,sreach:2,reach:3};
const fitLabel={safety:"Safety",realistic:"Realistic",sreach:"Slight reach",reach:"Reach"};
const fitBadge={safety:"b-safety",realistic:"b-realistic",sreach:"b-sreach",reach:"b-reach"};
const diLabel={"very_important":"Very Important","important":"Important","considered":"Considered","not_considered":"Not tracked"};
const diBadge={"very_important":"b-di-vi","important":"b-di-imp","considered":"b-di-con","not_considered":"b-di-no"};

let currentFilter='all',sortCol='fit',sortDir=1,currentTab='overview';
const userNotes={},userFit={};

function moneyC(v){return v<45000?'mlo':v<65000?'mmd':'mhi';}
function fmt(v){return'$'+Math.round(v/1000)+'k';}
function fmtN(n){return n>=1000?(n/1000).toFixed(1)+'k':n.toString();}
function distFmt(d){return`<span class="${d<=180?'dist-ok':'dist-far'}">${d}mi</span>`;}
function testBadge(p){
  if(p==='required')return'<span class="badge b-red">Required</span>';
  if(p==='blind')return'<span class="badge b-teal">Test-blind</span>';
  return'<span class="badge b-green">Optional</span>';
}
function stfClass(r){return r<=12?'stf-good':r<=17?'stf-mid':'stf-large';}
function stfLabel(r){return r?`<span class="${stfClass(r)}" style="font-weight:500">${r}:1</span>`:'<span style="color:var(--color-text-secondary,#888)">N/R</span>';}
function sizeCellHtml(s){
  return`<div class="sz-line">${fmtN(s.totalUG)} <span style="font-size:10px;color:var(--color-text-secondary,#888)">UG</span></div><div class="sz-sub">~${fmtN(s.freshClass)} freshmen</div><div class="sz-sub">S:F ${stfLabel(s.stf)}</div>`;
}
function greekFmt(g,note){
  if(!g)return`<span class="badge b-gray">None</span><div style="font-size:9px;color:var(--color-text-secondary,#888);margin-top:2px">${note}</div>`;
  return`<span class="badge b-purple">${g}</span><div style="font-size:9px;color:var(--color-text-secondary,#888);margin-top:2px">${note}</div>`;
}
function switchTab(t,el){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderHeaders();renderTable();}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderTable();}
function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}renderTable();}

function getFiltered(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  return schools.filter(s=>{
    if(q&&!s.name.toLowerCase().includes(q)&&!s.st.toLowerCase().includes(q))return false;
    const f=userFit[s.name]||s.fit;
    if(currentFilter==='safety')return f==='safety';
    if(currentFilter==='realistic')return f==='realistic';
    if(currentFilter==='sreach')return f==='sreach';
    if(currentFilter==='reach')return f==='reach';
    if(currentFilter==='prevetq')return s.pv.toLowerCase().includes('pre-vet')||s.pv.toLowerCase().includes('vet');
    if(currentFilter==='budget')return s.cost<45000;
    if(currentFilter==='dc3hr')return s.distDC<=180;
    if(currentFilter==='pvd3hr')return s.distPVD<=180;
    if(currentFilter==='smallclass')return s.stf&&s.stf<=12;
    if(currentFilter==='nogreek')return s.greek===null;
    if(currentFilter==='small')return s.totalUG<5000;
    return true;
  });
}

function renderTable(){
  let data=getFiltered();
  data.sort((a,b)=>{
    if(sortCol==='name')return sortDir*a.name.localeCompare(b.name);
    if(sortCol==='cost')return sortDir*(a.cost-b.cost);
    if(sortCol==='np')return sortDir*(a.np-b.np);
    if(sortCol==='aid')return sortDir*(b.aid-a.aid);
    if(sortCol==='need')return sortDir*(b.need-a.need);
    if(sortCol==='accept')return sortDir*(a.accept-b.accept);
    if(sortCol==='distDC')return sortDir*(a.distDC-b.distDC);
    if(sortCol==='distPVD')return sortDir*(a.distPVD-b.distPVD);
    if(sortCol==='totalUG')return sortDir*(a.totalUG-b.totalUG);
    if(sortCol==='stf')return sortDir*((a.stf||99)-(b.stf||99));
    if(sortCol==='fit')return sortDir*(fitOrd[userFit[a.name]||a.fit]-fitOrd[userFit[b.name]||b.fit]);
    if(sortCol==='test'){const to={required:0,blind:1,optional:2};return sortDir*((to[a.test]||2)-(to[b.test]||2));}
    if(sortCol==='di'){const d={'very_important':0,'important':1,'considered':2,'not_considered':3};return sortDir*((d[a.diLevel]||2)-(d[b.diLevel]||2));}
    if(sortCol==='greek')return sortDir*((b.greek?1:0)-(a.greek?1:0));
    return 0;
  });

  const tbody=document.getElementById('tBody');
  tbody.innerHTML='';
  data.forEach(s=>{
    const cf=userFit[s.name]||s.fit;
    const overviewContent=userNotes[s.name]!==undefined?userNotes[s.name]:s.rationale;
    const otherContent=userNotes[s.name+'_other']||'';
    const accBadge=s.accept<25?'b-red':s.accept<55?'b-amber':'b-green';
    const eqBadge=s.eq.includes('IHSA +')||s.eq.includes('degree')||s.eq.includes('D3')?'b-green':'b-blue';
    const pvBadge=s.pv.toLowerCase().includes('pre-vet')||s.pv.toLowerCase().includes('vet')?'b-green':'b-blue';
    const movedTag=s.moved?'<span class="badge b-moved" style="font-size:9px;margin-left:4px;vertical-align:middle">↑</span>':'';

    const nameCell=`<td style="min-width:152px;vertical-align:top">
      <div class="sname"><a href="${s.url}" target="_blank" class="sl">${s.name}</a>${s.instate?' <span class="badge b-instate" style="font-size:9px">In-state</span>':''}${movedTag}</div>
      <div class="ssub">${s.st} · ${s.tp}</div>
    </td>`;
    const fitCell=`<td style="min-width:88px;vertical-align:top;padding-top:8px"><span class="badge ${fitBadge[cf]}">${fitLabel[cf]}</span></td>`;
    const fitSelCell=`<td style="min-width:88px;vertical-align:top"><select class="fit-sel" data-school="${s.name}" onchange="updFit(this)">${Object.entries(fitLabel).map(([k,v])=>`<option value="${k}" ${k===cf?'selected':''}>${v}</option>`).join('')}</select></td>`;
    const distCells=`<td style="min-width:52px;vertical-align:top">${distFmt(s.distDC)}</td><td style="min-width:58px;vertical-align:top">${distFmt(s.distPVD)}</td>`;
    const diCell=`<td style="min-width:88px;vertical-align:top"><span class="badge ${diBadge[s.diLevel]}">${diLabel[s.diLevel]}</span></td>`;
    const notesCell=`<td style="min-width:150px;vertical-align:top"><textarea class="notes-ta" data-school="${s.name}_other" rows="2" placeholder="Notes..." onchange="saveNote(this)" oninput="autoSz(this)">${otherContent}</textarea></td>`;
    const sizeCell=`<td style="min-width:115px;vertical-align:top">${sizeCellHtml(s)}</td>`;

    let cells='';
    if(currentTab==='overview'){
      const taRows=Math.max(3,Math.ceil(s.rationale.length/36));
      cells=`${nameCell}${fitCell}
        <td style="min-width:66px;vertical-align:top"><span class="money ${moneyC(s.cost)}">${fmt(s.cost)}</span>${s.instate?'<div style="font-size:9px;color:#1A4FA0">in-state</div>':''}</td>
        <td style="min-width:64px;vertical-align:top"><span class="money mlo">${fmt(s.np)}</span></td>
        <td style="min-width:86px;vertical-align:top"><span class="badge ${eqBadge}" style="font-size:10px;white-space:normal;line-height:1.4">${s.eq}</span></td>
        <td style="min-width:74px;vertical-align:top"><span class="badge ${pvBadge}" style="font-size:10px;white-space:normal;line-height:1.4">${s.pv}</span></td>
        <td style="min-width:50px;vertical-align:top;letter-spacing:-2px">${s.campus}</td>
        ${distCells}
        <td style="min-width:70px;vertical-align:top">${testBadge(s.test)}</td>
        ${diCell}
        <td style="min-width:190px;vertical-align:top"><textarea class="notes-ta" data-school="${s.name}" rows="${taRows}" onchange="saveNoteMain(this)" oninput="autoSz(this)">${overviewContent}</textarea></td>`;
    } else if(currentTab==='financial'){
      const nmBadge=s.need>=95?'b-green':s.need>=75?'b-blue':'b-gray';
      cells=`${nameCell}${fitCell}
        <td style="min-width:68px;vertical-align:top"><span class="money ${moneyC(s.cost)}">${fmt(s.cost)}</span></td>
        <td style="min-width:64px;vertical-align:top"><span class="money mlo">${fmt(s.np)}</span></td>
        <td style="min-width:56px;vertical-align:top"><span class="money mlo">${fmt(s.cost-s.np)}</span></td>
        <td style="min-width:50px;vertical-align:top"><span class="money">${s.aid}%</span><div class="bar-wrap"><div class="bar-fill" style="width:${s.aid}%"></div></div></td>
        <td style="min-width:48px;vertical-align:top"><span class="badge ${s.merit?'b-green':'b-gray'}">${s.merit?'Yes':'No'}</span></td>
        <td style="min-width:54px;vertical-align:top"><span class="badge ${nmBadge}">${s.need}%</span></td>
        <td style="min-width:50px;vertical-align:top"><span class="badge ${accBadge}">${s.accept}%</span></td>
        ${distCells}${notesCell}`;
    } else if(currentTab==='academic'){
      cells=`${nameCell}${fitCell}
        <td style="min-width:50px;vertical-align:top"><span class="badge ${accBadge}">${s.accept}%</span></td>
        <td style="min-width:88px;vertical-align:top" class="money">${s.sat}</td>
        ${sizeCell}
        <td style="min-width:40px;vertical-align:top"><span class="badge b-gray">${s.tp[0]}</span></td>
        <td style="min-width:86px;vertical-align:top"><span class="badge ${eqBadge}" style="font-size:10px;white-space:normal;line-height:1.4">${s.eq}</span></td>
        <td style="min-width:74px;vertical-align:top"><span class="badge ${pvBadge}" style="font-size:10px;white-space:normal;line-height:1.4">${s.pv}</span></td>
        <td style="min-width:50px;vertical-align:top;letter-spacing:-2px">${s.campus}</td>
        ${distCells}${notesCell}`;
    } else if(currentTab==='testing'){
      cells=`${nameCell}${fitSelCell}
        <td style="min-width:80px;vertical-align:top">${testBadge(s.test)}</td>
        <td style="min-width:180px;vertical-align:top;font-size:10px;color:var(--color-text-secondary,#888)">${s.testNote}</td>
        <td style="min-width:88px;vertical-align:top" class="money">${s.sat}</td>
        <td style="min-width:50px;vertical-align:top"><span class="badge ${accBadge}">${s.accept}%</span></td>
        ${diCell}${distCells}
        <td style="min-width:150px;vertical-align:top;font-size:10px;color:var(--color-text-secondary,#888)">${s.fitNote}</td>`;
    } else {
      cells=`${nameCell}${fitCell}
        <td style="min-width:50px;vertical-align:top;letter-spacing:-2px">${s.campus}</td>
        <td style="min-width:140px;vertical-align:top">${greekFmt(s.greek,s.greekNote)}</td>
        ${diCell}
        <td style="min-width:86px;vertical-align:top"><span class="badge ${eqBadge}" style="font-size:10px;white-space:normal;line-height:1.4">${s.eq}</span></td>
        ${sizeCell}
        <td style="min-width:40px;vertical-align:top"><span class="badge b-gray">${s.tp[0]}</span></td>
        ${distCells}${notesCell}`;
    }
    const row=document.createElement('tr');
    row.innerHTML=cells;
    tbody.appendChild(row);
  });
  renderStats(data);
}

function updFit(sel){userFit[sel.dataset.school]=sel.value;renderTable();}
function saveNoteMain(ta){userNotes[ta.dataset.school]=ta.value;}
function saveNote(ta){userNotes[ta.dataset.school]=ta.value;}
function autoSz(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}

function renderStats(data){
  const counts={safety:0,realistic:0,sreach:0,reach:0};
  data.forEach(s=>{const f=userFit[s.name]||s.fit;counts[f]=(counts[f]||0)+1;});
  const smallClass=data.filter(s=>s.stf&&s.stf<=12).length;
  const avgStf=data.filter(s=>s.stf).length?Math.round(data.filter(s=>s.stf).reduce((a,s)=>a+s.stf,0)/data.filter(s=>s.stf).length):0;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat"><div class="sl">Showing</div><div class="sv">${data.length}</div></div>
    <div class="stat"><div class="sl">Safety</div><div class="sv" style="color:#2D6A0F">${counts.safety}</div></div>
    <div class="stat"><div class="sl">Realistic</div><div class="sv" style="color:#1A4FA0">${counts.realistic}</div></div>
    <div class="stat"><div class="sl">Slight reach</div><div class="sv" style="color:#8A500A">${counts.sreach}</div></div>
    <div class="stat"><div class="sl">Reach</div><div class="sv" style="color:#A32020">${counts.reach}</div></div>
    <div class="stat"><div class="sl">Avg S:F ratio</div><div class="sv">${avgStf}:1</div></div>
    <div class="stat"><div class="sl">S:F ≤12:1</div><div class="sv">${smallClass}</div></div>
  `;
}

renderHeaders();
renderTable();
</script>
</body>
